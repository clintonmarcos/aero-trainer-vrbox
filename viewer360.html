<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101316">
    <title>Visualizador 360° — Aero Trainer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101316;
        --panel: rgba(16, 19, 22, 0.9);
        --panel-2: #20272d;
        --line: #303940;
        --accent: #40c4a4;
        --accent-2: #f2b84b;
        --text: #f4f7f8;
        --muted: #a8b4bc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

      #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }

      /* ---- Top bar ---- */
      #topbar {
        z-index: 10; flex-shrink: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }
      .eyebrow {
        display: block; margin-bottom: 2px;
        font-size: 0.68rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.09em;
        color: var(--accent);
      }
      #topbar h1 { font-size: 1rem; font-weight: 800; letter-spacing: 0; }
      .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

      button {
        border: 0; cursor: pointer; font: inherit; color: inherit;
        min-height: 38px; border-radius: 7px; padding: 0 13px;
        background: rgba(32, 39, 45, 0.85);
        border: 1px solid var(--line);
        transition: background 0.14s, border-color 0.14s;
        white-space: nowrap;
      }
      button:hover { border-color: var(--accent); }
      button.active { background: var(--accent); color: #071210; font-weight: 800; border-color: var(--accent); }

      #openBtn {
        display: flex; align-items: center; gap: 7px;
        background: var(--accent); color: #071210; font-weight: 800; border-color: var(--accent);
      }
      #openBtn:hover { filter: brightness(1.08); }

      /* ---- Canvas wrap ---- */
      #canvas-wrap { flex: 1; position: relative; overflow: hidden; }

      #c {
        width: 100%; height: 100%; display: block;
        cursor: grab; touch-action: none;
      }
      #c.dragging { cursor: grabbing; }

      /* ---- Drop zone ---- */
      #dropZone {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: rgba(9, 11, 13, 0.78);
        pointer-events: none;
      }
      #dropZone.hidden { display: none; }
      #dropZone .drop-icon { opacity: 0.35; }
      #dropZone strong { display: block; font-size: 1.15rem; margin-bottom: 6px; }
      #dropZone p { color: var(--muted); text-align: center; line-height: 1.5; }

      /* ---- Loading spinner ---- */
      #loading {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: rgba(9, 11, 13, 0.65);
        pointer-events: none;
      }
      #loading.hidden { display: none; }
      .spinner {
        width: 40px; height: 40px;
        border: 3px solid rgba(64, 196, 164, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading p { color: var(--muted); font-size: 0.88rem; }

      /* ---- HUD ---- */
      #hud {
        position: absolute; left: 16px; bottom: 16px;
        padding: 11px 15px;
        border-radius: 9px;
        background: rgba(9, 11, 13, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.11);
        backdrop-filter: blur(12px);
        pointer-events: none;
        max-width: min(380px, calc(100% - 32px));
        transition: opacity 0.3s;
      }
      #hud .hud-mode {
        font-size: 0.7rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.09em;
        color: var(--accent-2); margin-bottom: 4px;
      }
      #hud .hud-title { font-size: 1.05rem; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
      #hud .hud-hint { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }

      /* ---- Gallery ---- */
      #galleryPanel {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 12px 16px;
        background: rgba(9, 11, 13, 0.88);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(14px);
        z-index: 5;
        transition: transform 0.22s ease;
      }
      #galleryPanel.hidden { transform: translateY(100%); }
      .gallery-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 10px;
      }
      .gallery-header h3 { font-size: 0.82rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
      .gallery-header button { min-height: 28px; padding: 0 10px; font-size: 0.78rem; }
      #galleryItems {
        display: flex; gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .g-item {
        flex-shrink: 0; width: 96px;
        border-radius: 7px; border: 2px solid transparent;
        overflow: hidden; cursor: pointer; background: var(--panel-2);
        transition: border-color 0.15s, transform 0.12s;
      }
      .g-item:hover { border-color: var(--accent); transform: translateY(-2px); }
      .g-item.active { border-color: var(--accent); }
      .g-item img { width: 100%; height: 54px; object-fit: cover; display: block; }
      .g-item span { display: block; padding: 4px 6px 5px; font-size: 0.66rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---- Keyboard hint ---- */
      #keyhint {
        position: absolute; right: 16px; bottom: 16px;
        padding: 8px 12px;
        border-radius: 7px;
        background: rgba(9, 11, 13, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
        font-size: 0.72rem; color: var(--muted); line-height: 1.6;
        transition: opacity 0.4s;
      }
      #keyhint.fade { opacity: 0; }
      #keyhint kbd {
        display: inline-block; padding: 1px 5px;
        border-radius: 3px; background: var(--panel-2);
        border: 1px solid var(--line);
        font-family: inherit; font-size: 0.72rem;
      }

      #fileInput { display: none; }

      @media (max-width: 620px) {
        .eyebrow { display: none; }
        #topbar h1 { font-size: 0.9rem; }
        #keyhint { display: none; }
        .controls { gap: 6px; }
        button { min-height: 34px; padding: 0 10px; font-size: 0.88rem; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <div>
          <span class="eyebrow">Aero Trainer VR Box</span>
          <h1 id="photoTitle">Visualizador 360°</h1>
        </div>
        <div class="controls">
          <button id="gyroBtn" title="Ativar giroscópio">Giroscópio</button>
          <button id="resetBtn" title="Centralizar vista">Centralizar</button>
          <button id="galleryBtn" title="Galeria de panoramas">Galeria</button>
          <button id="fullscreenBtn" title="Tela cheia">[ ]</button>
          <button id="openBtn">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16v2a2 2 0 002 2h14a2 2 0 002-2v-2M12 4v12m-4-4l4 4 4-4"/>
            </svg>
            Abrir foto
          </button>
        </div>
      </div>

      <div id="canvas-wrap">
        <canvas id="c"></canvas>

        <div id="dropZone">
          <svg class="drop-icon" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12l4-4 4 4M12 8v8"/>
          </svg>
          <div style="text-align:center">
            <strong>Arraste uma foto 360° aqui</strong>
            <p>ou clique em "Abrir foto"<br>Formatos: JPG · PNG · WebP</p>
          </div>
        </div>

        <div id="loading" class="hidden">
          <div class="spinner"></div>
          <p>Carregando panorama…</p>
        </div>

        <div id="hud">
          <div class="hud-mode">Imagem 360°</div>
          <div class="hud-title" id="hudTitle">Nenhuma foto carregada</div>
          <div class="hud-hint" id="hudHint">Abra uma foto 360° equiretangular para explorar.</div>
        </div>

        <div id="keyhint" aria-hidden="true">
          <kbd>←→↑↓</kbd> navegar &nbsp; <kbd>scroll</kbd> zoom &nbsp; <kbd>R</kbd> centralizar
        </div>

        <div id="galleryPanel" class="hidden">
          <div class="gallery-header">
            <h3>Panoramas do projeto</h3>
            <button id="closeGalleryBtn">Fechar</button>
          </div>
          <div id="galleryItems"></div>
        </div>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
    <script>
      "use strict";

      // ── Three.js setup ──────────────────────────────────────────────────────
      const canvas   = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
      camera.position.set(0, 0, 0);

      const geometry = new THREE.SphereGeometry(500, 64, 48);
      geometry.scale(-1, 1, 1); // flip normals to render from inside

      const sphere = new THREE.Mesh(
        geometry,
        new THREE.MeshBasicMaterial({ color: 0x101316 })
      );
      scene.add(sphere);

      // ── State ───────────────────────────────────────────────────────────────
      let lon = 0, lat = 0;
      let targetLon = 0, targetLat = 0;
      let fov = 75, targetFov = 75;
      let isDragging  = false;
      let gyroEnabled = false;
      let gyroBase    = null;
      let hasPhoto    = false;
      let keyhintTimer = null;

      const pointers = new Map(); // id → { x, y }

      // ── Resize ──────────────────────────────────────────────────────────────
      function resize() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight || 1;
        if (renderer.domElement.width !== w || renderer.domElement.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      // ── Load panorama ────────────────────────────────────────────────────────
      function loadTexture(src, label) {
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("dropZone").classList.add("hidden");

        new THREE.TextureLoader().load(
          src,
          texture => {
            texture.colorSpace = THREE.SRGBColorSpace;
            sphere.material = new THREE.MeshBasicMaterial({ map: texture });
            hasPhoto = true;

            document.getElementById("photoTitle").textContent = label;
            document.getElementById("hudTitle").textContent   = label;
            document.getElementById("hudHint").textContent    =
              "Arraste para olhar ao redor · Scroll ou pinça para zoom";
            document.getElementById("loading").classList.add("hidden");

            targetLon = 0; targetLat = 0;
            lon = 0; lat = 0;
            targetFov = 75; fov = 75;
            camera.fov = 75;
            camera.updateProjectionMatrix();

            // Sync gallery active state
            document.querySelectorAll(".g-item").forEach(el =>
              el.classList.toggle("active", el.dataset.src === src)
            );
          },
          undefined,
          () => {
            document.getElementById("loading").classList.add("hidden");
            if (!hasPhoto) document.getElementById("dropZone").classList.remove("hidden");
            alert("Não foi possível carregar a imagem.");
          }
        );
      }

      // ── Render loop ──────────────────────────────────────────────────────────
      function animate() {
        requestAnimationFrame(animate);
        resize();

        // Smooth interpolation
        const k = 0.1;
        lon += (targetLon - lon) * k;
        lat += (targetLat - lat) * k;
        fov += (targetFov - fov) * k;
        lat = Math.max(-85, Math.min(85, lat));

        const phi   = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);

        camera.fov = fov;
        camera.updateProjectionMatrix();
        camera.lookAt(
          500 * Math.sin(phi) * Math.cos(theta),
          500 * Math.cos(phi),
          500 * Math.sin(phi) * Math.sin(theta)
        );

        renderer.render(scene, camera);
      }
      animate();

      // ── Pointer (mouse + touch) ───────────────────────────────────────────
      canvas.addEventListener("pointerdown", e => {
        isDragging = true;
        canvas.classList.add("dragging");
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener("pointermove", e => {
        if (!isDragging) return;
        const prev = pointers.get(e.pointerId);
        if (!prev) return;
        const curr = { x: e.clientX, y: e.clientY };

        if (pointers.size === 1) {
          // Pan
          const dx = curr.x - prev.x;
          const dy = curr.y - prev.y;
          targetLon -= dx * 0.14;
          targetLat += dy * 0.14;
          targetLat = Math.max(-85, Math.min(85, targetLat));
        } else if (pointers.size === 2) {
          // Pinch zoom — compare current distance with previous distance
          const other = [...pointers.entries()].find(([id]) => id !== e.pointerId);
          if (other) {
            const op  = other[1];
            const prevDist = Math.hypot(prev.x - op.x, prev.y - op.y);
            const currDist = Math.hypot(curr.x - op.x, curr.y - op.y);
            targetFov = Math.max(30, Math.min(110, targetFov - (currDist - prevDist) * 0.14));
          }
        }

        pointers.set(e.pointerId, curr);
      });

      ["pointerup", "pointercancel"].forEach(type => {
        canvas.addEventListener(type, e => {
          pointers.delete(e.pointerId);
          if (pointers.size === 0) {
            isDragging = false;
            canvas.classList.remove("dragging");
          }
        });
      });

      canvas.addEventListener("wheel", e => {
        e.preventDefault();
        targetFov = Math.max(30, Math.min(110, targetFov + e.deltaY * 0.04));
      }, { passive: false });

      // ── Keyboard ─────────────────────────────────────────────────────────
      const PAN_STEP  = 3;
      const ZOOM_STEP = 4;
      const keys = new Set();

      window.addEventListener("keydown", e => {
        keys.add(e.key);
        if (e.key === "r" || e.key === "R") { targetLon = 0; targetLat = 0; targetFov = 75; }
        if (e.key === "f" || e.key === "F") toggleFullscreen();
      });
      window.addEventListener("keyup", e => keys.delete(e.key));

      setInterval(() => {
        if (keys.has("ArrowLeft"))  targetLon -= PAN_STEP;
        if (keys.has("ArrowRight")) targetLon += PAN_STEP;
        if (keys.has("ArrowUp"))    targetLat  = Math.min(85,  targetLat + PAN_STEP);
        if (keys.has("ArrowDown"))  targetLat  = Math.max(-85, targetLat - PAN_STEP);
        if (keys.has("+") || keys.has("=")) targetFov = Math.max(30,  targetFov - ZOOM_STEP);
        if (keys.has("-"))                   targetFov = Math.min(110, targetFov + ZOOM_STEP);
      }, 16);

      // ── Gyroscope ─────────────────────────────────────────────────────────
      function onDeviceOrientation(e) {
        if (e.alpha == null || e.beta == null) return;
        if (!gyroBase) gyroBase = { alpha: e.alpha, beta: e.beta };
        targetLon = -(e.alpha - gyroBase.alpha) * 0.85;
        targetLat = Math.max(-85, Math.min(85, (e.beta - gyroBase.beta) * 0.7));
      }

      function startGyro() {
        window.addEventListener("deviceorientation", onDeviceOrientation);
        gyroEnabled = true;
        gyroBase    = null;
        document.getElementById("gyroBtn").classList.add("active");
        document.getElementById("gyroBtn").textContent = "Giroscópio ON";
      }

      function stopGyro() {
        window.removeEventListener("deviceorientation", onDeviceOrientation);
        gyroEnabled = false;
        gyroBase    = null;
        document.getElementById("gyroBtn").classList.remove("active");
        document.getElementById("gyroBtn").textContent = "Giroscópio";
      }

      document.getElementById("gyroBtn").addEventListener("click", () => {
        if (gyroEnabled) { stopGyro(); return; }
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          DeviceOrientationEvent.requestPermission()
            .then(perm => { if (perm === "granted") startGyro(); })
            .catch(() => alert("Permissão negada para giroscópio."));
        } else {
          startGyro();
        }
      });

      // ── Reset ─────────────────────────────────────────────────────────────
      document.getElementById("resetBtn").addEventListener("click", () => {
        targetLon = 0; targetLat = 0; targetFov = 75;
      });

      // ── Fullscreen ────────────────────────────────────────────────────────
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      }
      document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);

      // ── File open ─────────────────────────────────────────────────────────
      document.getElementById("openBtn").addEventListener("click", () => {
        document.getElementById("fileInput").click();
      });

      document.getElementById("fileInput").addEventListener("change", e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const url  = URL.createObjectURL(file);
        const name = file.name.replace(/\.[^.]+$/, "");
        loadTexture(url, name);
        e.target.value = "";
        closeGallery();
      });

      // ── Drag & drop ───────────────────────────────────────────────────────
      const wrap = document.getElementById("canvas-wrap");

      wrap.addEventListener("dragover", e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });

      wrap.addEventListener("drop", e => {
        e.preventDefault();
        const file = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith("image/"));
        if (!file) return;
        loadTexture(URL.createObjectURL(file), file.name.replace(/\.[^.]+$/, ""));
        closeGallery();
      });

      // ── Gallery ───────────────────────────────────────────────────────────
      const panoramas = [
        { src: "assets/panoramas/cessna-172-apron-360.png",            label: "Cessna 172 — Pátio" },
        { src: "assets/panoramas/cessna-172-cockpit-360.png",          label: "Cessna 172 — Cabine" },
        { src: "assets/panoramas/cessna-172-control-surfaces-360.png", label: "Cessna 172 — Superfícies" },
        { src: "assets/panoramas/cessna-172-engine-propeller-360.png", label: "Cessna 172 — Motor" },
        { src: "assets/panoramas/cessna-172-landing-gear-360.png",     label: "Cessna 172 — Trem de Pouso" },
        { src: "assets/panoramas/airbus-a320neo-exterior-360.png",     label: "A320neo — Exterior" },
        { src: "assets/panoramas/airbus-a320neo-cockpit-360.png",      label: "A320neo — Cockpit" },
        { src: "assets/panoramas/airbus-a320neo-control-surfaces-360.png", label: "A320neo — Superfícies" },
        { src: "assets/panoramas/airbus-a320neo-engine-360.png",       label: "A320neo — Motor" },
        { src: "assets/panoramas/airbus-a320neo-landing-gear-360.png", label: "A320neo — Trem de Pouso" },
      ];

      const galleryItems = document.getElementById("galleryItems");
      panoramas.forEach(p => {
        const item = document.createElement("div");
        item.className = "g-item";
        item.dataset.src = p.src;
        item.title = p.label;
        item.innerHTML = `<img src="${p.src}" alt="${p.label}" loading="lazy"><span>${p.label}</span>`;
        item.addEventListener("click", () => {
          loadTexture(p.src, p.label);
          closeGallery();
        });
        galleryItems.appendChild(item);
      });

      function closeGallery() {
        document.getElementById("galleryPanel").classList.add("hidden");
        document.getElementById("galleryBtn").classList.remove("active");
      }

      document.getElementById("galleryBtn").addEventListener("click", () => {
        const panel = document.getElementById("galleryPanel");
        const isOpen = !panel.classList.contains("hidden");
        if (isOpen) {
          closeGallery();
        } else {
          panel.classList.remove("hidden");
          document.getElementById("galleryBtn").classList.add("active");
        }
      });

      document.getElementById("closeGalleryBtn").addEventListener("click", closeGallery);

      // ── Keyboard hint fade-out ────────────────────────────────────────────
      const keyhint = document.getElementById("keyhint");
      keyhintTimer = setTimeout(() => keyhint.classList.add("fade"), 5000);

      canvas.addEventListener("pointerdown", () => {
        keyhint.classList.add("fade");
        clearTimeout(keyhintTimer);
      });

      // ── Load from URL param ?src=… ────────────────────────────────────────
      const urlSrc = new URLSearchParams(location.search).get("src");
      if (urlSrc) {
        const name = urlSrc.split("/").pop().replace(/\.[^.]+$/, "");
        loadTexture(urlSrc, name);
      }
    </script>
  </body>
</html>
